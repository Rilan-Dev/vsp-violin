name: Deploy to Vercel

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Install dependencies
        run: bun install

      - name: Run lint
        run: bun run lint
        continue-on-error: true

      - name: Setup Supabase schema for Prisma
        run: |
          # Use PostgreSQL schema for production
          cat > prisma/schema.prisma << 'PRISMA_PG'
          generator client {
            provider = "prisma-client-js"
          }
          datasource db {
            provider  = "postgresql"
            url       = env("DATABASE_URL")
            directUrl = env("DIRECT_URL")
          }
          PRISMA_PG
          # Append the models from the sqlite schema (they're the same)
          tail -n +15 prisma/schema.prisma.bak >> prisma/schema.prisma || true
        env:
          DATABASE_URL: ${{ secrets.SUPABASE_DB_URL }}
          DIRECT_URL: ${{ secrets.SUPABASE_DIRECT_URL }}

      - name: Generate Prisma client
        run: bun run db:generate
        env:
          DATABASE_URL: ${{ secrets.SUPABASE_DB_URL }}
          DIRECT_URL: ${{ secrets.SUPABASE_DIRECT_URL }}

      - name: Install Vercel CLI
        run: bun add -g vercel@latest

      - name: Pull Vercel env
        run: vercel pull --yes --token=${{ secrets.VERCEL_TOKEN }} --environment=production
        env:
          VERCEL_PROJECT_ID: ${{ secrets.VERCEL_PROJECT_ID }}
          VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}

      - name: Build project
        run: vercel build --prod --token=${{ secrets.VERCEL_TOKEN }}
        env:
          VERCEL_PROJECT_ID: ${{ secrets.VERCEL_PROJECT_ID }}
          VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
          DATABASE_URL: ${{ secrets.SUPABASE_DB_URL }}
          DIRECT_URL: ${{ secrets.SUPABASE_DIRECT_URL }}
          NEXT_PUBLIC_SUPABASE_URL: ${{ secrets.NEXT_PUBLIC_SUPABASE_URL }}
          NEXT_PUBLIC_SUPABASE_ANON_KEY: ${{ secrets.NEXT_PUBLIC_SUPABASE_ANON_KEY }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
          STUDIO_TOKEN: ${{ secrets.STUDIO_TOKEN }}

      - name: Deploy to Vercel
        run: vercel deploy --prebuilt --prod --token=${{ secrets.VERCEL_TOKEN }}
        env:
          VERCEL_PROJECT_ID: ${{ secrets.VERCEL_PROJECT_ID }}
          VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
